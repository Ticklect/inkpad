[package]
name = "inkpad"
default-run = "inkpad"
version = "0.0.0-beta"
edition = "2021"
build = "build.rs"
description = "A lightweight local-first desktop notebook and sketchpad"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-18", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility", "unstable-winit-030"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
png = "0.17"

[build-dependencies]
slint-build = "=1.18.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
